version = 1

[defaults]
ignorePaths = ["docs/**", "**/*.md", "**/*.lock", "**/*.json"]

[[skills]]
name = "security-review"
paths = ["src/**", "web/**", "mobile/**"]
remote = "getsentry/skills"

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]

[[skills.triggers]]
type = "local"

[[skills]]
name = "code-simplifier"
paths = ["src/**", "web/**", "mobile/**"]
remote = "getsentry/skills"

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]

[[skills.triggers]]
type = "local"

[[skills]]
name = "linter-rule-judge"
phase = 2
reportOn = "low"

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]

[[skills.triggers]]
type = "local"
